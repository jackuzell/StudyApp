<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="bookShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-opacity="0.25" flood-color="#000000"/>
    </filter>
  </defs>

  <!-- Right Paper Pages Edge (Cream / Slate Paper) -->
  <path d="M49 11 L51.5 11 C53 11 54 12 54 13.5 L54 50.5 C54 52 53 53 51.5 53 L49 53 Z" fill="#e2e8f0" />
  <line x1="51.5" y1="13" x2="51.5" y2="51" stroke="#cbd5e1" stroke-width="1" />

  <!-- Book Cover Body -->
  <rect x="10" y="8" width="41" height="48" rx="4" fill="#1e293b" stroke="rgba(255,255,255,0.18)" stroke-width="1" filter="url(#bookShadow)" />

  <!-- Spine Binding Strip on Left -->
  <path d="M10 12 C10 9.8 11.8 8 14 8 L19 8 L19 56 L14 56 C11.8 56 10 54.2 10 52 Z" fill="#0f172a" />
  <!-- Spine Border -->
  <line x1="19" y1="8" x2="19" y2="56" stroke="#334155" stroke-width="1.2" />

  <!-- Spine Stitch Marks -->
  <circle cx="14.5" cy="14" r="0.9" fill="#475569" />
  <circle cx="14.5" cy="22" r="0.9" fill="#475569" />
  <circle cx="14.5" cy="30" r="0.9" fill="#475569" />
  <circle cx="14.5" cy="38" r="0.9" fill="#475569" />
  <circle cx="14.5" cy="46" r="0.9" fill="#475569" />

  <!-- Center White Copy Book Label Sticker -->
  <rect x="24" y="17" width="23" height="20" rx="2.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />

  <!-- Ruled Exercise Lines on the Label -->
  <line x1="27" y1="22.5" x2="44" y2="22.5" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="27" y1="27.5" x2="44" y2="27.5" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="27" y1="32.5" x2="38" y2="32.5" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />

  <!-- Bookmark Ribbon at Bottom -->
  <path d="M29 53 L29 60.5 L32.5 58.5 L36 60.5 L36 53 Z" fill="#64748b" />
</svg>
